name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docuask
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: docuask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docuask -d docuask"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.6
        ports:
          - 6333:6333
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: docuask
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: docuask
      RUN_DB_TESTS: "1"
      RUN_VECTOR_TESTS: "1"
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and dev tools
        run: python -m pip install -e './backend[dev]'
      - name: Lint
        run: ruff check backend
      - name: Verify migrations up and down
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci-only-signing-key-with-at-least-32-characters
      - name: Test
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Test SSE parser
        run: npm test

