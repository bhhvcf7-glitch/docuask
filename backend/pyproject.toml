[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docuask-api"
version = "0.1.0"
description = "DocuAsk API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<27",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.9,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.18,<1",
    "aiofiles>=24.1,<26",
    "pypdf>=5.1,<7",
    "pypdfium2>=4.30,<6",
    "pdfplumber>=0.11,<1",
    "qdrant-client>=1.12,<1.14",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.3,<6",
]
extractor-comparison = [
    "PyMuPDF>=1.24,<3",
]
ocr = [
    "pytesseract>=0.3.13,<1",
    "Pillow>=10,<13",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "reportlab>=4.2,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ingestion" = ["arabic_words.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
